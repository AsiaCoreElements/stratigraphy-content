<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Test Quiz</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text: #1e293b;
      --text-muted: #64748b;
      --correct: #10b981;
      --wrong: #ef4444;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .quiz-container {
      background: var(--card);
      width: 100%;
      max-width: 540px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      padding: 2rem;
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    .question {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .option-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 0.875rem 1rem;
      text-align: left;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background-color: #f5f3ff;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.correct {
      border-color: var(--correct);
      background-color: #ecfdf5;
      color: #065f46;
      font-weight: 600;
    }

    .option-btn.wrong {
      border-color: var(--wrong);
      background-color: #fef2f2;
      color: #991b1b;
    }

    .controls {
      margin-top: 1.5rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .hidden {
      display: none;
    }

    .result-screen {
      text-align: center;
      padding: 1rem 0;
    }

    .score-circle {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 1rem 0;
    }

    .result-msg {
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="quiz-container">
    <!-- Active Quiz View -->
    <div id="quiz-view">
      <div class="header">
        <span id="question-counter">Question 1 of 5</span>
        <span id="score-tracker">Score: 0</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="question" id="question-text">Loading question...</div>
      <div class="options" id="options-container"></div>
      <div class="controls">
        <button class="btn hidden" id="next-btn">Next Question</button>
      </div>
    </div>

    <!-- Results View -->
    <div id="result-view" class="result-screen hidden">
      <h2>Quiz Completed!</h2>
      <div class="score-circle" id="final-score">0 / 5</div>
      <p class="result-msg" id="result-message"></p>
      <button class="btn" id="restart-btn">Play Again</button>
    </div>
  </div>

  <script>
    const questionBank = [
      {
        question: "Which mineral sits at the very top (10) of the Mohs hardness scale?",
        options: ["Corundum", "Topaz", "Diamond", "Quartz"],
        answer: 2
      },
      {
        question: "What does HTTP stand for in web addresses?",
        options: [
          "HyperText Transfer Protocol",
          "High Transmission Text Program",
          "Hyperlink Tracking Technology Process",
          "Host Transfer Text Protocol"
        ],
        answer: 0
      },
      {
        question: "Which planet in our solar system rotates clockwise on its axis?",
        options: ["Mars", "Venus", "Jupiter", "Saturn"],
        answer: 1
      },
      {
        question: "What type of rock is formed by the cooling and solidification of magma or lava?",
        options: ["Sedimentary", "Metamorphic", "Igneous", "Karst"],
        answer: 2
      },
      {
        question: "Which element has the chemical symbol 'W'?",
        options: ["Tungsten", "Tin", "Titanium", "Thallium"],
        answer: 0
      },
      {
        question: "Which atmospheric layer contains the majority of the Earth's ozone layer?",
        options: ["Troposphere", "Stratosphere", "Mesosphere", "Thermosphere"],
        answer: 1
      },
      {
        question: "In computer science, how many bits make up one byte?",
        options: ["4", "8", "16", "32"],
        answer: 1
      }
    ];

    let quizQuestions = [];
    let currentIndex = 0;
    let score = 0;
    const TOTAL_QUESTIONS = 5;

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const questionCounter = document.getElementById("question-counter");
    const scoreTracker = document.getElementById("score-tracker");
    const progressFill = document.getElementById("progress-fill");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const finalScore = document.getElementById("final-score");
    const resultMessage = document.getElementById("result-message");
    const restartBtn = document.getElementById("restart-btn");

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initQuiz() {
      quizQuestions = shuffleArray(questionBank).slice(0, TOTAL_QUESTIONS);
      currentIndex = 0;
      score = 0;
      resultView.classList.add("hidden");
      quizView.classList.remove("hidden");
      loadQuestion();
    }

    function loadQuestion() {
      nextBtn.classList.add("hidden");
      optionsContainer.innerHTML = "";

      const currentQ = quizQuestions[currentIndex];
      questionCounter.textContent = `Question ${currentIndex + 1} of ${TOTAL_QUESTIONS}`;
      scoreTracker.textContent = `Score: ${score}`;
      progressFill.style.width = `${((currentIndex) / TOTAL_QUESTIONS) * 100}%`;
      questionText.textContent = currentQ.question;

      currentQ.options.forEach((optionText, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = optionText;
        btn.addEventListener("click", () => selectAnswer(index, btn));
        optionsContainer.appendChild(btn);
      });
    }

    function selectAnswer(selectedIndex, selectedBtn) {
      const correctIndex = quizQuestions[currentIndex].answer;
      const allButtons = optionsContainer.querySelectorAll(".option-btn");

      allButtons.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === correctIndex) {
          btn.classList.add("correct");
        }
      });

      if (selectedIndex === correctIndex) {
        score++;
        scoreTracker.textContent = `Score: ${score}`;
      } else {
        selectedBtn.classList.add("wrong");
      }

      progressFill.style.width = `${((currentIndex + 1) / TOTAL_QUESTIONS) * 100}%`;
      nextBtn.textContent = currentIndex === TOTAL_QUESTIONS - 1 ? "See Results" : "Next Question";
      nextBtn.classList.remove("hidden");
    }

    function showResults() {
      quizView.classList.add("hidden");
      resultView.classList.remove("hidden");
      finalScore.textContent = `${score} / ${TOTAL_QUESTIONS}`;

      const ratio = score / TOTAL_QUESTIONS;
      if (ratio === 1) {
        resultMessage.textContent = "Flawless victory! You nailed every question.";
      } else if (ratio >= 0.6) {
        resultMessage.textContent = "Solid effort! You know your stuff.";
      } else {
        resultMessage.textContent = "Good warm-up! Give it another shot to beat your score.";
      }
    }

    nextBtn.addEventListener("click", () => {
      currentIndex++;
      if (currentIndex < TOTAL_QUESTIONS) {
        loadQuestion();
      } else {
        showResults();
      }
    });

    restartBtn.addEventListener("click", initQuiz);

    initQuiz();
  </script>
</body>
</html>
